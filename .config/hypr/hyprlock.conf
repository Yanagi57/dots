$text_color = rgba(FFFFFFFF)
$entry_background_color = rgba(33333311)
$entry_border_color = rgba(3B3B3B55)
$entry_color = rgba(FFFFFFFF)
$font_family = Roboto
$font_family_clock = Roboto Bold
$font_family_date = Roboto Italic
$font_material_symbols = MaterialIconsRound

general {
    hide_cursor = true
    ignore_empty_input = true
}

background {
    # color = rgba(0D0D17FF)
    # color = rgba(000000FF)
    monitor =
    # path = {{ SWWW_WALL }}
    # path = screenshot
    path = $HOME/.config/backgrounds/khaled-ali-unsplash.jpg
    blur_size = 0
    blur_passes = 0
}

input-field {
    monitor =
    size = 250, 30
    outline_thickness = 2
    dots_size = 0.1
    dots_spacing = 0.3
    outer_color = $entry_border_color
    inner_color = $entry_background_color
    font_family = $font_family
    fail_text = Incorrect! UwU
    fade_on_empty = true
    placeholder_text = Password:
    font_color = rgba(255, 255, 255, 0.8)
    rounding = -1
    check_color = rgba(204, 136, 34, 0.7)
    fail_color = rgba(204, 34, 34, 0.7)

    position = 0, 55
    halign = center
    valign = bottom
}

label {
    monitor =
    text = cmd[update:10000] echo -e "$(date +"%A, %B %-d")"
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 25
    font_family = $font_family_date

    position = 0, 380
    halign = center
    valign = center
}

label {
    monitor =
    text = $TIME
    shadow_passes = 1
    shadow_boost = 0.5
    color = $text_color
    font_size = 80
    font_family = $font_family_clock

    position = 0, 300
    halign = center
    valign = center
}

animations {
    animation = fadeIn, 0
    animation = fadeOut, 0
}

