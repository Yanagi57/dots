general {
    # Quickshell lock; hyprlock if Quickshell is not running, so the screen always locks
    lock_cmd = qs ipc call lock lock || pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    # no after_sleep_cmd: forcing DPMS on right at wake raced Hyprland's own resume and left
    # the display unrecoverable (crtc restore EINVAL) on 2026-10-17. Hyprland restores it itself.
}


listener {
    timeout = 300 # 5min.
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330 # 5.5min.
    on-timeout = systemctl suspend
}


